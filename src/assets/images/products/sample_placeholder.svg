<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <rect width="600" height="600" fill="#f8fafc"/>
  <g transform="translate(300, 300)">
    <!-- Outer dashed and solid circles -->
    <circle r="260" fill="none" stroke="#1d4ed8" stroke-width="8"/>
    <circle r="240" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-dasharray="10 8"/>
    <circle r="180" fill="none" stroke="#1d4ed8" stroke-width="6"/>
    
    <!-- Stars -->
    <g fill="#1d4ed8">
      <polygon points="0,-215 6,-200 22,-200 9,-190 14,-175 0,-185 -14,-175 -9,-190 -22,-200 -6,-200"/>
      <polygon points="-70,-200 -64,-185 -48,-185 -61,-175 -56,-160 -70,-170 -84,-160 -79,-175 -92,-185 -76,-185"/>
      <polygon points="70,-200 76,-185 92,-185 79,-175 84,-160 70,-170 56,-160 61,-175 48,-185 64,-185"/>
    </g>

    <!-- Top & Bottom Curved Text / Text -->
    <text y="-195" font-family="Arial, sans-serif" font-weight="900" font-size="42" fill="#1d4ed8" text-anchor="middle" letter-spacing="12">SAMPLE</text>
    <text y="235" font-family="Arial, sans-serif" font-weight="900" font-size="42" fill="#1d4ed8" text-anchor="middle" letter-spacing="12">SAMPLE</text>
    
    <!-- Rotated Center Banner -->
    <g transform="rotate(-15)">
      <rect x="-270" y="-55" width="540" height="110" rx="14" fill="#1d4ed8" stroke="#ffffff" stroke-width="4"/>
      <text x="0" y="24" font-family="Arial, sans-serif" font-weight="900" font-size="76" fill="#ffffff" text-anchor="middle" letter-spacing="8">SAMPLE</text>
    </g>

    <!-- Stars inside bottom -->
    <g fill="#1d4ed8">
      <polygon points="0,185 6,200 22,200 9,210 14,225 0,215 -14,225 -9,210 -22,200 -6,200"/>
      <polygon points="-70,170 -64,185 -48,185 -61,195 -56,210 -70,200 -84,210 -79,195 -92,185 -76,185"/>
      <polygon points="70,170 76,185 92,185 79,195 84,210 70,200 56,210 61,195 48,185 64,185"/>
    </g>
  </g>
</svg>
